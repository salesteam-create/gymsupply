name: Deploy to GitHub Pages

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let a running deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only the default branch publishes the site.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      # Pages serves the artifact as-is, but this keeps the _next directory
      # safe from Jekyll if the site is ever published another way.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
